name: Build Windows Qt Application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Qt 6 / Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qt5compat'
          cache: true
          aqtversion: '==3.2.*'

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "build/gui/tr4mpass-gui.exe"
          if (!(Test-Path $exe)) {
            Write-Error "Expected executable was not produced: $exe"
          }
          Write-Host "Built: $exe"

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "build/gui/tr4mpass-gui.exe" "package/tr4mpass-gui.exe"
          windeployqt --release --no-translations --compiler-runtime "package/tr4mpass-gui.exe"

      - name: Add project information
        shell: pwsh
        run: |
          Copy-Item README.md package/README.md
          if (Test-Path LICENSE) { Copy-Item LICENSE package/LICENSE }

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path package/* -DestinationPath tr4mpass-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: tr4mpass-windows-x64
          path: tr4mpass-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
